    <ellipse cx="-50" cy="-64" rx="11" ry="7" transform="rotate(-35 -50 -64)" fill="#fbf8ff" stroke="#3a3452" stroke-width="4"/>
    <ellipse cx="50" cy="-64" rx="11" ry="7" transform="rotate(35 50 -64)" fill="#fbf8ff" stroke="#3a3452" stroke-width="4"/>
    <path d="M -50,-12 C -52,-70 -46,-142 0,-142 C 46,-142 52,-70 50,-12 Q 37.5,6 25,-10 Q 12.5,6 0,-10 Q -12.5,6 -25,-10 Q -37.5,6 -50,-12 Z"
          fill="#fbf8ff" stroke="#3a3452" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="-17" cy="-95" rx="7" ry="10" fill="#2b2640"/>
    <ellipse cx="17" cy="-95" rx="7" ry="10" fill="#2b2640"/>
    <circle cx="-15" cy="-99" r="2.6" fill="#ffffff"/>
    <circle cx="19" cy="-99" r="2.6" fill="#ffffff"/>
