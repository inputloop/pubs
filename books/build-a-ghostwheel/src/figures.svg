<!-- figures.svg: the three characters, drawn once, pulled into each picture.
     Copyright 2026 Corwin Brust; CC-BY-SA-4.0. Original drawings for this book.
     Each figure stands with its feet at (0,0) and grows upward (negative y).
     A picture places one with <g data-figure="NAME" transform="..."></g>.
     Classes that move (only when motion is allowed): bob, pencil, lean, glowpulse. -->
<defs id="fig-defs">
  <radialGradient id="g-glow" cx="50%" cy="45%" r="50%">
    <stop offset="0" stop-color="#d9d0ff" stop-opacity="0.9"/>
    <stop offset="0.6" stop-color="#d9d0ff" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#d9d0ff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g-lamp" cx="50%" cy="60%" r="60%">
    <stop offset="0" stop-color="#fff6d6"/>
    <stop offset="1" stop-color="#ffd98a"/>
  </radialGradient>
  <linearGradient id="g-wall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f7ead3"/>
    <stop offset="1" stop-color="#efdcbb"/>
  </linearGradient>
  <linearGradient id="g-floor" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e2c79c"/>
    <stop offset="1" stop-color="#d4b383"/>
  </linearGradient>
</defs>

