    <ellipse cx="29" cy="-78" rx="8" ry="5" fill="#f7b6c8" opacity="0.8"/>
    <path d="M -7,-80 Q 0,-72 7,-80" fill="none" stroke="#2b2640" stroke-width="3" stroke-linecap="round"/>
  </g>
</g><!-- end spoke -->

